name: Feature request
description: Suggest an improvement to Selfcast
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be useful?
      description: What problem does it solve for people making podcasts with Selfcast?
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This can run fully locally, with no cloud services or accounts
        - label: This doesn't require more memory than a 16 GB laptop can spare
